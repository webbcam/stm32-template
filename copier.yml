project_name:
  type: str
  help: "Human-readable project name (e.g. 'Widget Controller')"

project_slug:
  type: str
  help: "Directory/identifier-safe name (e.g. widget-controller)"
  default: "{{ project_name.lower().replace(' ', '-').replace('_', '-') }}"
  validator: >-
    {% if not project_slug %}
    project_slug must not be empty
    {% elif not project_slug[0].isalpha() %}
    project_slug must start with a letter
    {% elif project_slug != project_slug.lower() %}
    project_slug must be lowercase
    {% elif project_slug.replace('-', '').replace('_', '').isalnum() is not true %}
    project_slug may only contain letters, digits, hyphens and underscores
    {% endif %}

board:
  type: str
  help: "Target board"
  default: blackpill_f401
  choices:
    "Blackpill — STM32F401CCU6, Cortex-M4F": blackpill_f401
    "Bluepill — STM32F103C8T6, Cortex-M3": bluepill_f103

# Derived, never asked (when: false). Selects which CMSIS-device/HAL submodule
# pair the project gets, and which branch of third_party/CMakeLists.txt runs.
mcu_family:
  type: str
  when: false
  default: "{% if board == 'bluepill_f103' %}f1{% else %}f4{% endif %}"

# NOTE: defining _exclude REPLACES Copier's DEFAULT_EXCLUDE rather than
# extending it. The first five entries are those defaults, restored by hand —
# without them Copier copies this repo's entire .git directory (including
# .git/modules/, i.e. every submodule's full history) plus copier.yml itself
# into every generated project.
#
# third_party/** is excluded because Copier clones the template's submodules
# when the source is a URL — verified: without it, generating from a URL
# produces a project with the full HAL/CMSIS/Unity source checked out as
# ORDINARY FILES (mode 100644) instead of pinned submodules. Deinitializing
# the submodules here does NOT prevent that; it only helps when generating
# from a local working copy. tools/bootstrap.sh restores them properly.
#
# boards/** is excluded then selectively re-included so a project only carries
# the board it targets. Written generically (rather than listing the boards
# not chosen) so adding a board needs no change here.
_exclude:
  - "copier.yml"
  - "copier.yaml"
  - ".git"
  - ".DS_Store"
  - "~*"
  - "third_party/**"
  - "!third_party/CMakeLists.txt"
  - "boards/**"
  - "!boards/README.md"
  - "!boards/{{ board }}/**"
